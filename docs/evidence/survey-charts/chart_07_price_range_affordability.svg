      <text x="80" y="616" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#15803d">ECONOMIC FEASIBILITY: 78.1% of families consider Rs. 100k–250k justifiable, matching our Rs. 110,950 BOM.</text>
