        <rect x="70" y="320" width="359" height="30" rx="6" fill="#8b5cf6"/>
        <text x="445" y="342" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#8b5cf6">14 (43.8%)</text>
        
        <text x="70" y="395" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">High monthly cost of hiring private home nurse</text>
        <rect x="70" y="405" width="750" height="30" rx="6" fill="#f1f5f9"/>
        <rect x="70" y="405" width="255" height="30" rx="6" fill="#f59e0b"/>
        <text x="341" y="427" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#f59e0b">10 (31.2%)</text>
        
        <text x="70" y="480" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Monitoring daily vitals (temperature &amp; heart rate)</text>
