    <!-- Main gradient tile with shadow -->
    <rect x="83.5" y="38.5" width="110" height="110" rx="32.5" fill="url(#alviTileGrad)" filter="url(#tileDropShadow)"/>
    <!-- Inner top highlight -->
    <rect x="84.5" y="39.5" width="108" height="108" rx="31.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    <!-- Inner White Symbol (centered) -->
    <g transform="translate(104.75, 59.75) scale(1.0547)">
