<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>AlviCare App Icon</title>
  <defs>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E"/>
      <stop offset="100%" stop-color="#0B4F4A"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#072B28" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background Tile -->
  <rect x="24" y="24" width="464" height="464" rx="136" fill="url(#tileGrad)" filter="url(#shadow)"/>
