        <rect x="70" y="150" width="692" height="30" rx="6" fill="#2563eb"/>
        <text x="778" y="172" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#2563eb">27 (84.4%)</text>
        
        <text x="70" y="225" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Fear of unnoticed falls when no one is in room</text>
        <rect x="70" y="235" width="750" height="30" rx="6" fill="#f1f5f9"/>
        <rect x="70" y="235" width="666" height="30" rx="6" fill="#e11d48"/>
        <text x="752" y="257" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#e11d48">26 (81.3%)</text>
        
        <text x="70" y="310" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Reaching them when mobile phone is unanswered</text>
