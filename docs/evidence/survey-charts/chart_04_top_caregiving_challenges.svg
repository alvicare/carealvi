        <text x="240" y="512" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0d9488">6 (18.8%)</text>
        
        <text x="70" y="565" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1e293b">Ensuring fresh drinking water is near when taking pills</text>
        <rect x="70" y="575" width="750" height="30" rx="6" fill="#f1f5f9"/>
        <rect x="70" y="575" width="154" height="30" rx="6" fill="#0284c7"/>
        <text x="240" y="597" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#0284c7">6 (18.8%)</text>
        
      <rect x="60" y="625" width="980" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="80" y="656" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#334155">Core Clinical Priorities: Pill verification (84.4%) and fall fear (81.3%) emerge as the two primary pain points in elderly homes.</text>
